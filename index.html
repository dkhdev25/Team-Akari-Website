<!DOCTYPE html>
<html lang="en">
<head>

    <title>Akari Entertainment</title>
    <link rel="icon" type="image/png" href="./icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Sora:wght@700&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lenis@1.3.4/dist/lenis.min.js"></script>

    <script>
        const lenis = new Lenis();

        function raf(time) {
            lerp: 0.07
            anchors: true

            lenis.raf(time)
            requestAnimationFrame(raf)
        }

        requestAnimationFrame(raf)
    </script>

            <li><a href="#portfolio"><i data-lucide="gamepad-2"></i><span>Games</span></a></li>
            <li><a href="#about"><i data-lucide="info"></i><span>About</span></a></li>
            <li><a href="#contact"><i data-lucide="mail"></i><span>Contact</span></a></li>
        </ul>
    </div>
</nav>

</button>
